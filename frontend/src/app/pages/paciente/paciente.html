<div class="container">
  <div class="header">
    <h1>Mis turnos</h1>
    <button (click)="logout()">Cerrar sesión</button>
  </div>

  <div class="reservar">
    <h2>Reservar nuevo turno</h2>
    <label for="fechaHora">Fecha y hora:</label>
    <input
      id="fechaHora"
      type="datetime-local"
      [(ngModel)]="fechaHora"
      name="fechaHora"
    />
    <button (click)="reservar()">Reservar</button>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="mensaje" *ngIf="mensaje">{{ mensaje }}</p>

  <h2>Historial</h2>
  <p *ngIf="cargando">Cargando...</p>

  <table *ngIf="!cargando && turnos.length > 0">
    <thead>
      <tr>
        <th>Fecha y hora</th>
        <th>Médico</th>
        <th>Estado</th>
        <th>Valor</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let turno of turnos">
        <td>{{ turno.fecha_hora | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ turno.medico_nombre }}</td>
        <td>{{ turno.estado }}</td>
        <td>{{ turno.valor_consulta }}</td>
        <td>
          <button *ngIf="puedeCancel(turno)" (click)="cancelar(turno.id)">
            Cancelar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && turnos.length === 0">No tenés turnos reservados.</p>
</div>
