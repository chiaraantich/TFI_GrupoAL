<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/img/logo-blanco.png" alt="" width="40" height="40" />
      <span>ProHealth</span>
    </div>

    <p class="side__role">{{ rol }}</p>

    @if (secciones.length) {
      <nav class="side__nav" aria-label="Secciones">
        @for (s of secciones; track s.id) {
          <button
            type="button"
            class="side__link"
            [class.active]="s.id === activa"
            [attr.aria-current]="s.id === activa ? 'page' : null"
            (click)="elegir(s.id)"
          >
            <span class="dot"></span>{{ s.etiqueta }}
          </button>
        }
      </nav>
    }

    <div class="side__user">
      <strong>{{ nombre }}</strong>
      <span>Sesión activa</span>
      <button class="side__logout" type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <header class="main__header">
      <h1>{{ titulo }}</h1>
      @if (subtitulo) {
        <p>{{ subtitulo }}</p>
      }
    </header>
    <ng-content></ng-content>
  </main>
</div>
