<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/img/logo-blanco.png" alt="" width="40" height="40" />
      <span>ProHealth</span>
    </div>

    <p class="side__role">{{ rol }}</p>

    <div class="side__user">
      <strong>{{ nombre }}</strong>
      <span>Sesión activa</span>
      <button class="side__logout" type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <header class="main__header">
      <h1>{{ titulo }}</h1>
      @if (subtitulo) {
        <p>{{ subtitulo }}</p>
      }
    </header>
    <ng-content></ng-content>
  </main>
</div>
